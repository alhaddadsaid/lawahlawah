workflows:
  android-test:
    name: Reelway - Android test build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
        - pattern: streaming-browser
          include: true
    scripts:
      # android/ and ios/ are committed (they carry the app name, permissions
      # and SDK levels), so no `flutter create` step is needed.
      - script: flutter pub get
      - script: flutter analyze --no-fatal-infos
      - script: flutter test
      - name: Build Android APK
        # Debug build: the Narto-Drama test adapter and sample titles are on.
        script: flutter build apk --debug --build-number=$BUILD_NUMBER
      - name: Build Android release APK
        # Store-style build: sample data and undocumented adapters are off.
        script: flutter build apk --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-testflight:
    name: Reelway - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Started by hand in Codemagic (no push trigger) to save free macOS minutes.
    # Needs, set up once in Codemagic: an App Store Connect API key integration
    # named "Reelway ASC", plus a distribution certificate and an App Store
    # profile for com.reelway.reelway (Team settings > Code signing identities).
    integrations:
      app_store_connect: Reelway ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.reelway.reelway
    scripts:
      - script: flutter pub get
      - script: flutter test
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        # Release build: the browser and pop-up protection are the same as in
        # debug; sample titles and the Narto-Drama test adapter are off.
        # REELWAY_TEST_PARTNER turns on the partner test page (httpbin.org);
        # drop it for an App Store release.
        script: |
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --dart-define=REELWAY_TEST_PARTNER=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get builds without Apple review.
        submit_to_testflight: true
