workflows:
  android-test:
    name: Reelway - Android test build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    # Android APKs are built by GitHub CI. Keep this workflow manual so an
    # app update does not queue duplicate Android work ahead of TestFlight.
    scripts:
      # android/ and ios/ are committed (they carry the app name, permissions
      # and SDK levels), so no `flutter create` step is needed.
      - script: flutter pub get
      - script: flutter analyze --no-fatal-infos
      - script: flutter test
      - name: Build Android APK
        # Debug build: the Narto-Drama test adapter and sample titles are on.
        script: flutter build apk --debug --build-number=$BUILD_NUMBER
      - name: Build Android release APK
        # Store-style build: sample data and undocumented adapters are off.
        # Google's test ads, because this APK goes on our own phones.
        script: flutter build apk --release --build-number=$BUILD_NUMBER --dart-define=REELWAY_TEST_ADS=true
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  android-play:
    name: Reelway - Play Store bundle
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      flutter: stable
      # Play upload key (Personal Account > Code signing identities). Codemagic
      # sets CM_KEYSTORE_PATH and friends, read by android/app/build.gradle.kts.
      android_signing:
        - reelway_upload
    scripts:
      - script: flutter pub get
      - script: flutter analyze --no-fatal-infos
      - script: flutter test
      - name: Build Play app bundle
        # Store build for "Reelway: Video Browser": real AdMob units.
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  android-startcheck:
    name: Reelway - Android start check (emulator)
    # Linux: Codemagic's Mac machines cannot run Android emulators.
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
    scripts:
      - script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release --dart-define=REELWAY_TEST_ADS=true
      - name: Launch emulator
        script: |
          flutter emulators --launch emulator &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 5; done
          adb shell getprop ro.build.version.release
      - name: Open the app and keep the log
        # Saves Android's own log of the first 30 seconds, so a crash on
        # start shows its real error.
        script: |
          mkdir -p logs
          adb install -r build/app/outputs/flutter-apk/app-release.apk
          adb logcat -c
          adb shell monkey -p com.reelbrow.videobrowser -c android.intent.category.LAUNCHER 1
          sleep 30
          adb logcat -d > logs/logcat.txt
          adb logcat -d -b crash > logs/crash.txt || true
          (adb shell pidof com.reelbrow.videobrowser || echo "NOT RUNNING") > logs/process.txt
          adb exec-out screencap -p > logs/screen.png
          cat logs/process.txt
          grep -E "FATAL|AndroidRuntime|DEBUG|Abort|signal" logs/logcat.txt | head -80 || true
    artifacts:
      - logs/*

  ios-testflight:
    name: Reelway - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Started by hand: pushes build the ReelBro test app (ios-reelbro) instead.
    # Needs, set up once in Codemagic: an App Store Connect API key integration
    # named "Reelway ASC", plus a distribution certificate and an App Store
    # profile for com.reelway.reelway (Team settings > Code signing identities).
    integrations:
      app_store_connect: Reelway ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.reelway.reelway
    scripts:
      - script: flutter pub get
      - script: dart format --output=none --set-exit-if-changed -l 120 lib test
      - script: flutter analyze
      - script: flutter test
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        # App Store build: real AdMob ads, no test partner page, no sample
        # titles, no Narto-Drama test adapter.
        script: |
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Uploads remain available to internal testers through their automatic group.
        # This flag requests EXTERNAL beta review, which is not needed here.
        submit_to_testflight: false

  ios-reelbro:
    name: ReelBro - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # The same app under its own App Store Connect record "ReelBro"
    # (com.reelway.reelbro, app 6829761642), used for testing since 2 Nov 2026.
    # Started by hand while TestFlight invitations are stuck (Apple case
    # 103016839116); pushes build ios-reelbro-adhoc instead.
    integrations:
      app_store_connect: Reelway ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.reelway.reelbro
    scripts:
      - script: flutter pub get
      - script: dart format --output=none --set-exit-if-changed -l 120 lib test
      - script: flutter analyze
      - script: flutter test
      - name: Use the ReelBro app identity
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.reelway.reelway;/PRODUCT_BUNDLE_IDENTIFIER = com.reelway.reelbro;/' \
            ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ReelBro" ios/Runner/Info.plist
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --dart-define=REELWAY_TEST_PARTNER=true \
            --dart-define=REELWAY_TEST_ADS=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  ios-reelbro-adhoc:
    name: ReelBro - iOS direct install (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 45
    # Installs straight on registered iPhones, no TestFlight. Profile
    # "ReelBro Ad Hoc" (Codemagic reference reelbro_ad_hoc) lists the devices;
    # a new tester's iPhone must be added to it in the Apple Developer portal
    # and the profile fetched again in Codemagic.
    triggering:
      events: [push]
      cancel_previous_builds: true
      branch_patterns:
        - pattern: streaming-browser
          include: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.reelway.reelbro
    scripts:
      - script: flutter pub get
      - script: dart format --output=none --set-exit-if-changed -l 120 lib test
      - script: flutter analyze
      - script: flutter test
      - name: Use the ReelBro app identity
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.reelway.reelway;/PRODUCT_BUNDLE_IDENTIFIER = com.reelway.reelbro;/' \
            ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ReelBro" ios/Runner/Info.plist
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --dart-define=REELWAY_TEST_PARTNER=true \
            --dart-define=REELWAY_TEST_ADS=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        # The email carries the install link for the registered iPhones.
        recipients:
          - alhaddadsaid.es@gmail.com
        notify:
          success: true
          failure: true
