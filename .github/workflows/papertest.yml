name: memecoin paper test

# 4 runs a day of about 340 minutes, so data is collected almost around the clock.
# The script stops by itself after end_date_utc in config.json.
on:
  schedule:
    - cron: "5 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: papertest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          # results are not needed to run, and the folder grows every day
          sparse-checkout: |
            papertest
            .github

      - name: Unit tests
        run: python3 -m unittest test_engine

      - name: Paper trading run
        run: python3 -m papertest.run

      - name: Save results to the repository
        if: always()
        run: |
          find results -name "ticks.csv" -exec gzip -f {} \; 2>/dev/null || true
          git config user.name "papertest-bot"
          git config user.email "papertest-bot@users.noreply.github.com"
          git add --sparse results || true
          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          git commit -m "results: run $(date -u +%Y%m%d-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep 10
          done
