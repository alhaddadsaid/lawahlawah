name: daily research

# Replays all saved data with the pre-registered variants (RESEARCH_RULES.md)
# and writes reports/latest.md. It only reports; it never changes the rules.
on:
  schedule:
    - cron: "50 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest test_engine

      - name: Research
        run: python3 research.py

      - name: Save report
        run: |
          git config user.name "papertest-bot"
          git config user.email "papertest-bot@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research report $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep 10
          done
