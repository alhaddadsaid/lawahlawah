name: gold research

on:
  push:
    paths: ["gold_research.py"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/gold
          key: gold-m1-v1-${{ github.run_id }}
          restore-keys: gold-m1-v1-
      - name: Research
        run: |
          if [ ! -f gold_research.py ]; then echo "script not uploaded yet"; exit 0; fi
          python3 -u gold_research.py
      - name: Save report
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add reports/gold.md reports/gold.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "gold research report"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
