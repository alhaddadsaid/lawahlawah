name: Android start check

# Play review check on an emulator: builds the release APK, reads its manifest
# the way Play's scanner does, opens it on Android 14, runs Android's monkey
# tester (random taps and swipes) to find crashes and freezes, and keeps the
# logs and screenshots. Runs when this file changes (bump the run note below),
# or by hand once it is on main.
# Run note: 3
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-startcheck.yml

jobs:
  startcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=REELWAY_TEST_ADS=true
      - name: Read the manifest like Play's scanner
        run: |
          mkdir -p logs
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          $AAPT2 dump badging $APK > logs/badging.txt
          $AAPT2 dump xmltree --file AndroidManifest.xml $APK > logs/manifest.txt
          ls -la $APK > logs/size.txt
          head -40 logs/badging.txt
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app and stress it on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.reelbrow.videobrowser -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > logs/1-start.png
            (adb shell pidof com.reelbrow.videobrowser || echo NOT_RUNNING) > logs/process-start.txt
            adb shell monkey -p com.reelbrow.videobrowser --pct-syskeys 0 --pct-appswitch 0 --throttle 250 -s 42 -v 3000 > logs/monkey.txt 2>&1 || true
            sleep 5
            adb exec-out screencap -p > logs/2-after-monkey.png
            (adb shell pidof com.reelbrow.videobrowser || echo NOT_RUNNING) > logs/process-after.txt
            adb logcat -d > logs/logcat.txt
            adb logcat -d -b crash > logs/crash.txt || true
            adb shell dumpsys activity processes | grep -i -A3 "anr\|not responding" > logs/anr.txt || true
            tail -5 logs/monkey.txt
            cat logs/process-start.txt logs/process-after.txt
            head -40 logs/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startcheck-logs
          path: logs/
          retention-days: 7
