name: agent desk

# Four long runs a day (about 5h45 each), the same pattern as the memecoin paper test.
# Inside each run the desk scans every 3 minutes and checks open positions every 5 seconds.
on:
  schedule:
    - cron: "5 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest saved state, not the commit from when the run was queued (can be hours old)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Desk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MINUTES: "345"
          AGENTS_GIT: "1"
        run: |
          git config user.name "agent-desk"
          git config user.email "agent-desk@users.noreply.github.com"
          python3 -u agents.py
      - name: Save
        if: always()
        run: |
          git config user.name "agent-desk"
          git config user.email "agent-desk@users.noreply.github.com"
          git add agents reports/agents.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "agent desk run"
          for i in 1 2 3 4 5; do (git pull --rebase --autostash -X theirs || (git rebase --abort; false)) && git push && break; sleep 7; done
