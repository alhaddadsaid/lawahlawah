name: Site probe

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node probe/probe.mjs https://narto-drama.com/
        continue-on-error: true
      - name: Save results to the probe-out branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: probe-out
          publish_dir: probe-out
          force_orphan: true
