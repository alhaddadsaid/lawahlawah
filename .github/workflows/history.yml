name: history study

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Study past prices
        run: python3 history.py
      - name: Save report and price history
        if: always()
        run: |
          git config user.name "papertest-bot"
          git config user.email "papertest-bot@users.noreply.github.com"
          git add reports data || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "history study $(date -u +%Y-%m-%d-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep 10
          done
